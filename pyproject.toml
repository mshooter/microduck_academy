[project]
name = "microduck-academy"
version = "0.1.0"
description = "MuJoCo simulation server for Pollen Robotics' Microduck, speaking the robot's own intent API (robot.move, robot.do, robot.look). Groundwork for a JdeRobot Robotics Academy exercise."
readme = "README.md"
authors = [
    { name = "Moira Shooter", email = "moira.shooter@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mujoco==3.10.0",
    "numpy==2.4.1",
    "onnxruntime==1.24.4",
    "pillow>=12.3.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
